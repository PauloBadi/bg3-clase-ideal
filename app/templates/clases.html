{% extends "base.html" %}
{% block titulo %}Las 12 clases{% endblock %}
{% block contenido %}
<h1>Las 12 clases de Baldur's Gate 3</h1>
<table>
  <tr><th>Clase</th><th>Rol</th><th>Dificultad</th></tr>
  {% for c in clases %}
  <tr>
    <td><a href="/clases/{{ c.slug }}">{{ c.nombre }}</a></td>
    <td>{{ c.rol }}</td>
    <td>{{ c.dificultad_texto }}</td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
